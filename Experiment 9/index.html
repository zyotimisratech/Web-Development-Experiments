
<!DOCTYPE html>
<html>
<head>
    <title>Literature and Art</title>
    <style>
        body {
            background-color: #F5EBDD;
            font-family: Georgia;
            text-align: center;
            color: #493B35;
        }
        h1, h2 {
            color: #863F2D;
        }
        /* Rounded Corners */
        .rounded {
            background-color: #E9DCC9;
            padding: 25px;
            margin: 20px;
            border: 2px solid #A98467;
            border-radius: 20px;
        }
        /* Border Image */
        .border {
            background-color: #E9DCC9;
            padding: 25px;
            margin: 20px;
            border: 10px solid transparent;
            border-image: linear-gradient(#863F2D, #C49A6C) 1;
        }
    </style>
</head>
<body>
    <h1>Literature & Art</h1>
    <p>A celebration of timeless stories and imagination.</p>
    <h2>Rounded Corners</h2>
    <div class="rounded">
        <h3>Charles Dickens</h3>
        <p>
            Charles Dickens was one of the greatest
            English novelists of the Victorian era.
        </p>
    </div>
    <h2>Border Image</h2>
    <div class="border">
        <h3>The World of Literature</h3>
        <p>
            Literature preserves human experiences,
            emotions and stories through words.
        </p>
    </div>
</body>
</html>
