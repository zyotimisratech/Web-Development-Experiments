
<!DOCTYPE html>
<html>
<head>
    <title>Tables and Multimedia</title>
</head>
<body>
    <h1>HTML Tables and Multimedia</h1>
    <h2>Student Information</h2>
    <table border="1">
        <tr>
            <th>Name</th>
            <th>Course</th>
            <th>Semester</th>
        </tr>
        <tr>
            <td>Jennie</td>
            <td>Bachelor of Arts in Comparative Literature</td>
            <td>First</td>
        </tr>
        <tr>
            <td>Mishti</td>
            <td>Bachelor of Technology - CSE</td>
            <td>Second</td>
        </tr>
        <tr>
            <td>Jyoti</td>
            <td>Bachelor of Technology - Data Science</td>
            <td>Third</td>
        </tr>
    </table>
    <h2>Audio</h2>
    <audio controls>
        <source src="seawaves.mp3" type="audio/mpeg">
    </audio>
    <h2>Video</h2>
    <video width="400" controls>
        <source src="turtle.mp4" type="video/mp4">
    </video>
    <h2>The Ocean Wrote My Name</h2>
    <iframe src="https://www.canva.com/design/DAHKT4ErB_w/vF-nQkvjDA6IV4V6wZk-hw/view?embed"
            width="1000"
            height="500">
    </iframe>
</body>
</html>
