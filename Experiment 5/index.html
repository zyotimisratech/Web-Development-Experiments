
<!DOCTYPE html>
<html>
<head>
    <title>CSS Methods</title>
    <!-- Internal CSS -->
    <style>
        h2 {
            color: #526D82;
        }

        p {
            font-size: 18px;
        }
    </style>
    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Inline CSS -->
    <h1 style="color: #A44A3F;">Welcome to CSS</h1>
    <h2>Internal CSS Example</h2>
    <p>This paragraph is styled using internal CSS.</p>
    <h3>External CSS Example</h3>
    <p>This is another paragraph styled using external CSS.</p>
</body>
</html>
