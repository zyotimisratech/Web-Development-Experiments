
<!DOCTYPE html>
<html>
<head>
    <title>CSS Selectors</title>
    <style>
        /* Class Selector */
        .heading {
            color: #A44A3F;
        }
        /* ID Selector */
        #para {
            color: #526D82;
            font-size: 18px;
        }
        /* Pseudo-class Selector */
        a:hover {
            color: #687A55;
        }
    </style>
</head>
<body>
    <h1 class="heading">CSS Selectors</h1>
    <p id="para">
        CSS selectors are used to select HTML elements for styling.
    </p>
    <a href="https://www.google.com">Visit Google</a>
</body>
</html>
